<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-labelledby="title">
  <title id="title">A gold citrine ring presented in a velvet box</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFF9EF"/>
      <stop offset="0.6" stop-color="#F7E9D6"/>
      <stop offset="1" stop-color="#EEDCC3"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#FFE6B8"/>
      <stop offset="1" stop-color="#FFE6B8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="velvet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D4634E"/>
      <stop offset="0.55" stop-color="#A83E2E"/>
      <stop offset="1" stop-color="#7A2A20"/>
    </linearGradient>
    <linearGradient id="velvetIn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6D8C8"/>
      <stop offset="1" stop-color="#D9A98F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7DFA4"/>
      <stop offset="0.45" stop-color="#D9A84E"/>
      <stop offset="1" stop-color="#A9742B"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE1A0"/>
      <stop offset="0.5" stop-color="#E9A23B"/>
      <stop offset="1" stop-color="#B87525"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <ellipse cx="400" cy="430" rx="360" ry="340" fill="url(#halo)"/>
  <circle cx="400" cy="480" r="270" fill="none" stroke="#39271D" stroke-opacity="0.08" stroke-dasharray="2 10"/>
  <ellipse cx="404" cy="808" rx="240" ry="40" fill="#39271D" fill-opacity="0.2" filter="url(#soft)"/>

  <g>
    <!-- open lid -->
    <g transform="rotate(-13 400 470)">
      <rect x="260" y="360" width="300" height="200" rx="18" fill="url(#velvet)"/>
      <rect x="278" y="378" width="264" height="164" rx="12" fill="#F1DCCF"/>
      <rect x="292" y="392" width="236" height="136" rx="8" fill="#FBF0E6"/>
      <path d="M292 514 C338 480 462 480 528 514" stroke="#D8B79F" stroke-width="3" fill="none"/>
    </g>

    <!-- base -->
    <rect x="248" y="590" width="320" height="180" rx="22" fill="url(#velvet)"/>
    <rect x="266" y="606" width="284" height="148" rx="16" fill="#F1DCCF"/>
    <rect x="282" y="622" width="252" height="116" rx="10" fill="#FBF0E6"/>
    <path d="M282 738 C338 700 466 700 534 738" stroke="#D8B79F" stroke-width="3" fill="none"/>

    <!-- ring -->
    <circle cx="400" cy="618" r="66" fill="none" stroke="url(#gold)" stroke-width="16"/>
    <circle cx="400" cy="618" r="66" fill="none" stroke="#FFF7E2" stroke-opacity="0.45" stroke-width="4"/>
    <path d="M400 552 l30 26 -18 40 h-24 l-18 -40 Z" fill="url(#stone)" stroke="#8E5C1F" stroke-width="3"/>
    <path d="M400 552 l12 26 -12 14 -12 -14 Z" fill="#FFF3D0" opacity="0.75"/>
    <path d="M388 578 h24" stroke="#8E5C1F" stroke-opacity="0.35" stroke-width="2"/>

    <circle cx="448" cy="568" r="34" fill="#FFE3A8" opacity="0.7" filter="url(#glow)"/>

    <!-- base front lip -->
    <path d="M248 750 C248 774 578 774 568 750" stroke="#6E241B" stroke-opacity="0.35" stroke-width="6" fill="none"/>
  </g>

  <g fill="#E9A23B">
    <path d="M610 360 c1.6 12 5.6 16 18 18 -12.4 2-16.4 6-18 18-1.6-12-5.6-16-18-18 12.4-2 16.4-6 18-18Z"/>
    <path d="M186 560 c1.2 9 4.2 12 13 13 -8.8 1-11.8 4-13 13-1.2-9-4.2-12-13-13 8.8-1 11.8-4 13-13Z" fill="#C9503C"/>
    <path d="M628 640 c1 8 3.6 10.6 11 12 -7.4 1.4-10 4-11 12-1-8-3.6-10.6-11-12 7.4-1.4 10-4 11-12Z"/>
  </g>

  <rect width="800" height="1000" filter="url(#grain)"/>
</svg>
