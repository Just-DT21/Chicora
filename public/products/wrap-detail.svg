<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-labelledby="title">
  <title id="title">A close-up of cream satin ribbon crossing amber wrapping paper</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#F3BF77"/>
      <stop offset="0.45" stop-color="#E9A23B"/>
      <stop offset="1" stop-color="#B87525"/>
    </linearGradient>
    <radialGradient id="light" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFE3B4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFE3B4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9BE94"/>
      <stop offset="0.18" stop-color="#FFF9EC"/>
      <stop offset="0.4" stop-color="#FFFDF7"/>
      <stop offset="0.62" stop-color="#F0DCBB"/>
      <stop offset="0.82" stop-color="#FFF6E4"/>
      <stop offset="1" stop-color="#C6A877"/>
    </linearGradient>
    <linearGradient id="silk2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF9EC"/>
      <stop offset="0.5" stop-color="#EBD6B2"/>
      <stop offset="1" stop-color="#D6B98C"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E86952"/>
      <stop offset="1" stop-color="#962F22"/>
    </linearGradient>
    <pattern id="dots" width="54" height="54" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <circle cx="14" cy="14" r="3.4" fill="#FFF7E6" fill-opacity="0.35"/>
      <circle cx="41" cy="41" r="3.4" fill="#FFF7E6" fill-opacity="0.25"/>
    </pattern>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#dots)"/>
  <rect width="800" height="1000" fill="url(#light)"/>

  <g>
    <polygon points="-60,320 860,120 860,420 -60,620" fill="#7C4A17" opacity="0.25" filter="url(#blur)"/>
    <polygon points="-40,300 880,100 880,380 -40,580" fill="url(#silk)"/>
    <polygon points="-40,300 880,100 880,150 -40,350" fill="#FFFFFF" opacity="0.4"/>
    <polygon points="-40,530 880,330 880,380 -40,580" fill="#B49A70" opacity="0.35"/>

    <polygon points="560,-60 760,-60 420,1060 220,1060" fill="#7C4A17" opacity="0.2" filter="url(#blur)"/>
    <polygon points="590,-60 780,-60 440,1060 250,1060" fill="url(#silk2)" opacity="0.97"/>
    <polygon points="590,-60 650,-60 310,1060 250,1060" fill="#FFFFFF" opacity="0.35"/>

    <g transform="translate(620 150) rotate(-18)">
      <path d="M0 0 C-60 -52 -120 -12 -84 28 C-50 64 -16 34 0 12Z" fill="url(#red)"/>
      <path d="M0 0 C60 -52 120 -12 84 28 C50 64 16 34 0 12Z" fill="url(#red)"/>
      <ellipse rx="22" ry="18" fill="#E86952"/>
      <path d="M-8 20 C-36 66 -44 100 -34 122 C-12 104 2 74 4 44Z" fill="#B84533"/>
    </g>
  </g>

  <g fill="#FFF7E6" fill-opacity="0.35">
    <circle cx="120" cy="760" r="5"/>
    <circle cx="180" cy="880" r="4"/>
    <circle cx="70" cy="900" r="3"/>
    <circle cx="700" cy="820" r="5"/>
    <circle cx="750" cy="700" r="3.5"/>
  </g>

  <rect width="800" height="1000" filter="url(#grain)"/>
</svg>
