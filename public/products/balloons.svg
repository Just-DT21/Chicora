<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-labelledby="title">
  <title id="title">A bunch of matte balloons in amber, clay, cream and cherry</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFF9EF"/>
      <stop offset="0.6" stop-color="#F7EADA"/>
      <stop offset="1" stop-color="#EEDCC5"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#FFE5B9"/>
      <stop offset="1" stop-color="#FFE5B9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberB" cx="0.35" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#FAD9A4"/>
      <stop offset="0.5" stop-color="#E9A23B"/>
      <stop offset="1" stop-color="#B87525"/>
    </radialGradient>
    <radialGradient id="clayB" cx="0.35" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#FAD3B4"/>
      <stop offset="0.5" stop-color="#E8A16A"/>
      <stop offset="1" stop-color="#B87340"/>
    </radialGradient>
    <radialGradient id="cherryB" cx="0.35" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#F09E88"/>
      <stop offset="0.5" stop-color="#C9503C"/>
      <stop offset="1" stop-color="#8E3022"/>
    </radialGradient>
    <radialGradient id="creamB" cx="0.35" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#FFFDF7"/>
      <stop offset="0.6" stop-color="#F3E2C9"/>
      <stop offset="1" stop-color="#D6BB97"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <ellipse cx="400" cy="400" rx="380" ry="350" fill="url(#halo)"/>
  <ellipse cx="404" cy="862" rx="230" ry="34" fill="#39271D" fill-opacity="0.14" filter="url(#soft)"/>

  <g stroke-linecap="round" fill="none">
    <g stroke="#8A6A4D" stroke-width="2.4" opacity="0.65">
      <path d="M292 520 C280 620 340 640 372 716 C392 764 394 790 400 830"/>
      <path d="M438 430 C446 540 404 600 402 700 C402 750 400 790 400 830"/>
      <path d="M548 508 C560 610 480 650 428 720 C412 744 404 780 400 830"/>
      <path d="M224 548 C212 650 300 670 356 730 C382 758 396 792 400 830"/>
      <path d="M378 300 C360 420 392 520 396 620 C398 700 400 780 400 830"/>
    </g>
    <path d="M400 830 C392 812 384 806 374 800 M400 830 C408 812 416 806 426 800" stroke="#C9503C" stroke-width="9"/>
  </g>

  <g>
    <ellipse cx="286" cy="400" rx="96" ry="122" fill="url(#amberB)" transform="rotate(-14 286 400)"/>
    <path d="M286 518 l-16 22 h32 Z" fill="#B87525"/>
    <ellipse cx="254" cy="352" rx="26" ry="40" fill="#FFF3D6" opacity="0.4" transform="rotate(-20 254 352)"/>

    <ellipse cx="462" cy="300" rx="104" ry="130" fill="url(#creamB)" transform="rotate(8 462 300)"/>
    <path d="M462 426 l-16 22 h32 Z" fill="#D6BB97"/>
    <ellipse cx="426" cy="248" rx="28" ry="44" fill="#fff" opacity="0.55" transform="rotate(-16 426 248)"/>

    <ellipse cx="570" cy="404" rx="88" ry="114" fill="url(#cherryB)" transform="rotate(14 570 404)"/>
    <path d="M570 514 l-16 22 h32 Z" fill="#8E3022"/>
    <ellipse cx="540" cy="360" rx="24" ry="36" fill="#FFD8CC" opacity="0.45" transform="rotate(-18 540 360)"/>

    <ellipse cx="238" cy="520" rx="82" ry="104" fill="url(#clayB)" transform="rotate(-10 238 520)"/>
    <path d="M238 620 l-15 20 h30 Z" fill="#B87340"/>
    <ellipse cx="212" cy="482" rx="22" ry="32" fill="#FFF0E2" opacity="0.4" transform="rotate(-18 212 482)"/>

    <ellipse cx="392" cy="330" rx="72" ry="94" fill="url(#amberB)" transform="rotate(4 392 330)"/>
    <path d="M392 420 l-14 20 h28 Z" fill="#B87525"/>
  </g>

  <g fill="#E9A23B">
    <circle cx="168" cy="330" r="5"/>
    <circle cx="660" cy="290" r="4"/>
    <circle cx="676" cy="640" r="5" fill="#C9503C"/>
    <circle cx="150" cy="700" r="4" fill="#8C9A76"/>
    <path d="M634 236 c1.2 9 4.2 12 13 13 -8.8 1-11.8 4-13 13-1.2-9-4.2-12-13-13 8.8-1 11.8-4 13-13Z"/>
    <path d="M176 440 c1 8 3.6 10.6 11 12 -7.4 1.4-10 4-11 12-1-8-3.6-10.6-11-12 7.4-1.4 10-4 11-12Z" fill="#C9503C"/>
  </g>

  <rect width="800" height="1000" filter="url(#grain)"/>
</svg>
