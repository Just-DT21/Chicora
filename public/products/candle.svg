<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-labelledby="title">
  <title id="title">A hand-poured candle in a ribbed clay vessel</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFF9EF"/>
      <stop offset="0.6" stop-color="#F6EAD8"/>
      <stop offset="1" stop-color="#EFE0C9"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.32" r="0.54">
      <stop offset="0" stop-color="#FFE3B4"/>
      <stop offset="1" stop-color="#FFE3B4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B87525"/>
      <stop offset="0.24" stop-color="#E9A23B"/>
      <stop offset="0.52" stop-color="#F6C582"/>
      <stop offset="0.76" stop-color="#E0A044"/>
      <stop offset="1" stop-color="#A96A21"/>
    </linearGradient>
    <linearGradient id="wax" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF1D6"/>
      <stop offset="1" stop-color="#F0CF9C"/>
    </linearGradient>
    <linearGradient id="dish" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8A16A"/>
      <stop offset="1" stop-color="#B87525"/>
    </linearGradient>
    <radialGradient id="flame" cx="0.5" cy="0.7" r="0.6">
      <stop offset="0" stop-color="#FFF6D8"/>
      <stop offset="0.45" stop-color="#FFC75A"/>
      <stop offset="1" stop-color="#E9702B"/>
    </radialGradient>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <ellipse cx="400" cy="330" rx="380" ry="330" fill="url(#halo)"/>
  <path d="M170 780 C170 480 630 480 630 780" fill="none" stroke="#39271D" stroke-opacity="0.08" stroke-width="2"/>
  <ellipse cx="404" cy="812" rx="210" ry="36" fill="#39271D" fill-opacity="0.18" filter="url(#soft)"/>

  <circle cx="400" cy="330" r="86" fill="#FFD076" opacity="0.55" filter="url(#glow)"/>

  <g>
    <ellipse cx="400" cy="760" rx="196" ry="40" fill="url(#dish)"/>
    <ellipse cx="400" cy="748" rx="196" ry="36" fill="#F0B97E"/>
    <ellipse cx="400" cy="746" rx="172" ry="26" fill="#D99A54"/>

    <rect x="312" y="380" width="176" height="372" rx="30" fill="url(#body)"/>
    <g stroke="#7C4A17" stroke-opacity="0.22" stroke-width="3">
      <path d="M334 396 V736"/>
      <path d="M358 388 V744"/>
      <path d="M382 384 V748"/>
      <path d="M406 382 V750"/>
      <path d="M430 384 V748"/>
      <path d="M454 388 V744"/>
      <path d="M474 396 V736"/>
    </g>
    <ellipse cx="400" cy="380" rx="88" ry="24" fill="#F7D9A9"/>
    <ellipse cx="400" cy="378" rx="74" ry="18" fill="url(#wax)"/>
    <path d="M366 376 C382 366 418 366 434 376" stroke="#E2B983" stroke-width="3" fill="none" stroke-linecap="round"/>

    <path d="M400 360 V340" stroke="#39271D" stroke-width="5" stroke-linecap="round"/>
    <path d="M400 338 C420 314 414 282 400 262 C386 284 380 314 400 338 Z" fill="url(#flame)"/>
    <path d="M400 330 C409 316 406 298 400 288 C394 300 392 316 400 330 Z" fill="#FFF2C4"/>

    <g stroke="#FFF9EF" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M470 300 C502 260 458 232 486 190"/>
      <path d="M330 300 C300 262 338 236 316 198"/>
      <path d="M486 344 C514 316 486 292 504 264"/>
    </g>
  </g>

  <g transform="translate(600 690)">
    <path d="M0 60 C-36 22 -6 -20 22 4 C34 -22 66 -14 62 18 C92 12 96 52 60 62 Z" fill="#8C9A76" opacity="0.85"/>
    <path d="M24 58 C24 30 26 10 34 -8" stroke="#5E6B4C" stroke-width="3" fill="none"/>
    <path d="M34 -6 C20 -18 14 -30 14 -42 C28 -36 36 -24 34 -6Z" fill="#A7B48D"/>
  </g>

  <g fill="none" stroke="#B87525" stroke-opacity="0.5" stroke-width="2">
    <path d="M236 746 h-52"/>
    <path d="M616 746 h52"/>
  </g>
  <g fill="#C9503C">
    <path d="M214 560 c1 8 3.8 10.8 12 12 -8.2 1.2-11 4-12 12-1-8-3.8-10.8-12-12 8.2-1.2 11-4 12-12Z" opacity="0.75"/>
    <path d="M628 470 c1.2 9 4.2 12 13 13 -8.8 1-11.8 4-13 13-1.2-9-4.2-12-13-13 8.8-1 11.8-4 13-13Z" fill="#E9A23B"/>
  </g>

  <rect width="800" height="1000" filter="url(#grain)"/>
</svg>
