<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-labelledby="title">
  <title id="title">A cream canvas tote bag with an amber sun print</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFF9EF"/>
      <stop offset="0.6" stop-color="#F7EAD9"/>
      <stop offset="1" stop-color="#EEDCC3"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#FFE6BE"/>
      <stop offset="1" stop-color="#FFE6BE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D8C1A0"/>
      <stop offset="0.25" stop-color="#F7ECD8"/>
      <stop offset="0.55" stop-color="#FFFCF4"/>
      <stop offset="0.82" stop-color="#F1E3CC"/>
      <stop offset="1" stop-color="#D2B892"/>
    </linearGradient>
    <linearGradient id="strap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9AE85"/>
      <stop offset="0.5" stop-color="#F2E4CC"/>
      <stop offset="1" stop-color="#C2A57A"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <ellipse cx="400" cy="430" rx="380" ry="360" fill="url(#halo)"/>
  <ellipse cx="404" cy="862" rx="250" ry="34" fill="#39271D" fill-opacity="0.16" filter="url(#soft)"/>

  <g>
    <g fill="none" stroke="url(#strap)" stroke-width="20" stroke-linecap="round">
      <path d="M300 430 C300 300 380 288 396 288"/>
      <path d="M500 430 C500 300 420 288 404 288"/>
    </g>

    <path d="M252 430 C252 416 264 408 280 408 H520 C536 408 548 416 548 430 L572 772 C574 802 554 818 526 818 H274 C246 818 226 802 228 772 Z" fill="url(#canvas)"/>
    <path d="M252 430 C252 416 264 408 280 408 H520 C536 408 548 416 548 430 L552 472 H248 Z" fill="#F7ECD8"/>

    <path d="M252 430 C300 446 500 446 548 430" stroke="#C9AE85" stroke-width="3" fill="none" opacity="0.8"/>
    <path d="M240 730 C300 748 500 748 560 730" stroke="#C9AE85" stroke-width="2" fill="none" opacity="0.5"/>

    <g>
      <circle cx="400" cy="586" r="66" fill="#E9A23B"/>
      <path d="M400 586 m-66 0 a66 66 0 0 1 132 0 Z" fill="#F3C382" opacity="0.55"/>
      <g stroke="#E9A23B" stroke-width="6" stroke-linecap="round">
        <path d="M400 482 V498"/>
        <path d="M336 506 L326 492"/>
        <path d="M464 506 L474 492"/>
        <path d="M318 570 H334"/>
        <path d="M466 570 H482"/>
      </g>
      <path d="M330 670 C354 650 378 668 400 660 C424 650 446 666 470 656" stroke="#B87525" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M344 690 C364 676 380 688 400 682 C420 676 438 686 456 678" stroke="#E8A16A" stroke-width="4" fill="none" stroke-linecap="round"/>
      <text x="400" y="736" text-anchor="middle" font-family="Georgia, serif" font-size="19" letter-spacing="7" fill="#39271D" fill-opacity="0.6">CHICORA</text>
    </g>

    <g stroke="#C9AE85" stroke-width="2.4" stroke-dasharray="5 7" opacity="0.8" fill="none">
      <path d="M246 436 L236 766"/>
      <path d="M554 436 L564 766"/>
      <path d="M236 800 C300 816 500 816 564 800"/>
    </g>

    <path d="M330 452 C336 560 330 680 340 800" stroke="#D8C1A0" stroke-width="3" fill="none" opacity="0.5"/>
    <path d="M470 452 C464 560 470 680 460 800" stroke="#D8C1A0" stroke-width="3" fill="none" opacity="0.5"/>
  </g>

  <g fill="#B87525" opacity="0.8">
    <path d="M182 380 c1.2 9 4.2 12 13 13 -8.8 1-11.8 4-13 13-1.2-9-4.2-12-13-13 8.8-1 11.8-4 13-13Z"/>
    <path d="M648 620 c1 8 3.6 10.6 11 12 -7.4 1.4-10 4-11 12-1-8-3.6-10.6-11-12 7.4-1.4 10-4 11-12Z" fill="#C9503C"/>
  </g>

  <rect width="800" height="1000" filter="url(#grain)"/>
</svg>
