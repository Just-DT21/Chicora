<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-labelledby="title">
  <title id="title">Two hand-thrown stoneware mugs with amber rims</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFF9EF"/>
      <stop offset="0.6" stop-color="#F7EBDC"/>
      <stop offset="1" stop-color="#EEDFCB"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.38" r="0.55">
      <stop offset="0" stop-color="#FFE7C3"/>
      <stop offset="1" stop-color="#FFE7C3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="creamMug" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E2C9A9"/>
      <stop offset="0.3" stop-color="#FBF2E2"/>
      <stop offset="0.6" stop-color="#FFFDF7"/>
      <stop offset="1" stop-color="#DCC1A0"/>
    </linearGradient>
    <linearGradient id="clayMug" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A8612C"/>
      <stop offset="0.28" stop-color="#E8A16A"/>
      <stop offset="0.55" stop-color="#F2BC8C"/>
      <stop offset="1" stop-color="#A15B26"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <ellipse cx="400" cy="420" rx="370" ry="340" fill="url(#halo)"/>
  <ellipse cx="410" cy="790" rx="300" ry="46" fill="#39271D" fill-opacity="0.16" filter="url(#soft)"/>
  <path d="M140 742 H660" stroke="#39271D" stroke-opacity="0.12" stroke-width="2"/>

  <g>
    <!-- cream mug -->
    <path d="M258 470 C238 500 236 560 250 600" stroke="#DCC1A0" stroke-width="26" fill="none" stroke-linecap="round"/>
    <path d="M258 470 C238 500 236 560 250 600" stroke="#FFF9EF" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.5"/>
    <rect x="330" y="420" width="180" height="320" rx="22" fill="url(#creamMug)"/>
    <ellipse cx="420" cy="420" rx="90" ry="26" fill="#EBD6BB"/>
    <ellipse cx="420" cy="418" rx="78" ry="20" fill="#F9EDDA"/>
    <ellipse cx="420" cy="418" rx="68" ry="16" fill="#D8B58C" opacity="0.55"/>
    <ellipse cx="420" cy="422" rx="62" ry="12" fill="#A8703E" opacity="0.5"/>
    <path d="M340 436 C352 462 488 462 500 436" stroke="#E9A23B" stroke-width="7" fill="none" opacity="0.8"/>
    <path d="M420 566 C402 548 386 540 386 526 C386 512 402 508 420 526 C438 508 454 512 454 526 C454 540 438 548 420 566 Z" fill="#C9503C" opacity="0.85"/>
    <path d="M356 700 C388 712 452 712 484 700" stroke="#D2B492" stroke-width="3" fill="none" opacity="0.7"/>

    <!-- clay mug -->
    <path d="M618 500 C654 512 660 574 630 612" stroke="#B87525" stroke-width="28" fill="none" stroke-linecap="round"/>
    <path d="M618 500 C654 512 660 574 630 612" stroke="#F0B97E" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.5"/>
    <rect x="470" y="470" width="190" height="290" rx="24" fill="url(#clayMug)" opacity="0.96"/>
    <ellipse cx="565" cy="470" rx="95" ry="27" fill="#C9822B"/>
    <ellipse cx="565" cy="468" rx="82" ry="21" fill="#F6D5AC"/>
    <ellipse cx="565" cy="468" rx="70" ry="16" fill="#6E4220" opacity="0.55"/>
    <ellipse cx="565" cy="472" rx="64" ry="12" fill="#4A2A12" opacity="0.45"/>
    <path d="M480 488 C492 514 638 514 650 488" stroke="#FFF3DD" stroke-width="6" fill="none" opacity="0.65"/>
    <path d="M540 620 c10 -14 28 -10 28 4 0 14 -18 22 -28 32 -10 -10 -28 -18 -28 -32 0 -14 18 -18 28 -4Z" fill="#FFF3DD" opacity="0.55"/>
    <g stroke="#8E4F1E" stroke-opacity="0.28" stroke-width="2.5" fill="none">
      <path d="M500 700 C540 712 596 712 632 700"/>
      <path d="M488 640 C500 656 520 664 540 664"/>
    </g>

    <g stroke="#FFF9EF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7">
      <path d="M392 360 C420 322 372 296 398 254"/>
      <path d="M446 368 C474 330 426 304 452 262"/>
      <path d="M574 392 C602 354 554 328 580 286"/>
    </g>
  </g>

  <g fill="#E9A23B">
    <path d="M180 330 c1.2 9 4.2 12 13 13 -8.8 1-11.8 4-13 13-1.2-9-4.2-12-13-13 8.8-1 11.8-4 13-13Z"/>
    <path d="M676 700 c1 8 3.6 10.6 11 12 -7.4 1.4-10 4-11 12-1-8-3.6-10.6-11-12 7.4-1.4 10-4 11-12Z" fill="#C9503C"/>
  </g>

  <rect width="800" height="1000" filter="url(#grain)"/>
</svg>
