<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-labelledby="title">
  <title id="title">Nine hand-finished chocolates in an open gift box</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFF9EF"/>
      <stop offset="0.6" stop-color="#F7EAD8"/>
      <stop offset="1" stop-color="#EEDCC3"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#FFE4B6"/>
      <stop offset="1" stop-color="#FFE4B6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#5A3A26"/>
      <stop offset="1" stop-color="#38241A"/>
    </linearGradient>
    <linearGradient id="tray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C99B5C"/>
      <stop offset="0.5" stop-color="#E7C68E"/>
      <stop offset="1" stop-color="#B08747"/>
    </linearGradient>
    <linearGradient id="milk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9713F"/>
      <stop offset="1" stop-color="#6E4220"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6B4128"/>
      <stop offset="1" stop-color="#3A2115"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <ellipse cx="400" cy="430" rx="380" ry="350" fill="url(#halo)"/>
  <ellipse cx="404" cy="842" rx="280" ry="42" fill="#39271D" fill-opacity="0.18" filter="url(#soft)"/>

  <g transform="rotate(-7 400 470)">
    <rect x="238" y="330" width="350" height="120" rx="16" fill="#4A2C1C"/>
    <rect x="252" y="344" width="322" height="92" rx="10" fill="#F3E2CA"/>
    <path d="M252 420 C310 392 516 392 574 420" stroke="#D8BC97" stroke-width="3" fill="none"/>
  </g>

  <g>
    <rect x="190" y="470" width="420" height="330" rx="24" fill="url(#box)"/>
    <rect x="212" y="492" width="376" height="286" rx="14" fill="url(#tray)"/>
    <rect x="228" y="508" width="344" height="254" rx="8" fill="#F5E7D2"/>

    <g stroke="#D8BE9A" stroke-width="2" opacity="0.7">
      <path d="M342 508 V762"/>
      <path d="M458 508 V762"/>
      <path d="M228 592 H572"/>
      <path d="M228 678 H572"/>
    </g>

    <!-- chocolates -->
    <g>
      <g transform="translate(285 550)">
        <ellipse rx="44" ry="38" fill="url(#milk)"/>
        <ellipse cy="-8" rx="28" ry="16" fill="#C58F58" opacity="0.6"/>
        <path d="M-30 6 C-10 -6 10 14 30 0" stroke="#F3D7A8" stroke-width="4" fill="none" stroke-linecap="round"/>
      </g>
      <g transform="translate(400 550)">
        <rect x="-38" y="-34" width="76" height="68" rx="10" fill="url(#dark)"/>
        <circle cx="0" cy="0" r="15" fill="#E9A23B"/>
        <circle cx="-4" cy="-4" r="5" fill="#B87525" opacity="0.7"/>
      </g>
      <g transform="translate(515 550)">
        <ellipse rx="42" ry="36" fill="url(#milk)"/>
        <path d="M0 28 C-22 12 -34 0 -30 -14 C-24 -26 -8 -20 0 -6 C8 -20 24 -26 30 -14 C34 0 22 12 0 28Z" fill="#6B4128" opacity="0.55"/>
      </g>

      <g transform="translate(285 636)">
        <circle r="40" fill="url(#dark)"/>
        <path d="M-24 -12 C-6 -26 14 -24 24 -8" stroke="#C99B5C" stroke-width="4" fill="none" stroke-linecap="round"/>
        <ellipse cx="-10" cy="-14" rx="8" ry="5" fill="#fff" opacity="0.18" transform="rotate(-20)"/>
      </g>
      <g transform="translate(400 636)">
        <ellipse rx="44" ry="36" fill="url(#milk)"/>
        <path d="M-32 -4 H32 M-24 8 H24 M-14 20 H14" stroke="#F3D7A8" stroke-width="4" opacity="0.7" stroke-linecap="round"/>
      </g>
      <g transform="translate(515 636)">
        <rect x="-38" y="-34" width="76" height="68" rx="30" fill="#EAD8BE"/>
        <path d="M-20 -6 C0 -24 20 -24 20 -6 C20 12 0 24 0 24 C0 24 -20 12 -20 -6Z" fill="url(#milk)" opacity="0.8"/>
      </g>

      <g transform="translate(285 716)">
        <ellipse rx="42" ry="34" fill="url(#dark)"/>
        <path d="M-26 0 C-6 -10 10 -2 26 -12" stroke="#E9A23B" stroke-width="4" fill="none" stroke-linecap="round"/>
      </g>
      <g transform="translate(400 716)">
        <ellipse rx="42" ry="34" fill="url(#milk)"/>
        <ellipse cy="-6" rx="24" ry="13" fill="#8A552C" opacity="0.5"/>
      </g>
      <g transform="translate(515 716)">
        <circle r="38" fill="url(#milk)"/>
        <circle r="16" fill="#F3E2CA" opacity="0.75"/>
        <circle r="8" fill="#E9A23B"/>
      </g>
    </g>

    <rect x="190" y="470" width="420" height="330" rx="24" fill="none" stroke="#2A1A11" stroke-opacity="0.35" stroke-width="4"/>
    <path d="M190 496 H610" stroke="#8B5E36" stroke-opacity="0.4" stroke-width="3"/>
  </g>

  <g transform="translate(624 500) rotate(12)">
    <rect x="0" y="0" width="96" height="52" rx="4" fill="#FFF7E6" stroke="#39271D" stroke-opacity="0.2"/>
    <circle cx="16" cy="14" r="4" fill="#F3E3CB" stroke="#39271D" stroke-opacity="0.25"/>
    <path d="M28 32 h48 M28 42 h34" stroke="#B87525" stroke-width="2"/>
  </g>

  <g fill="#E9A23B">
    <path d="M160 360 c1.2 9 4.2 12 13 13 -8.8 1-11.8 4-13 13-1.2-9-4.2-12-13-13 8.8-1 11.8-4 13-13Z"/>
    <path d="M668 700 c1 8 3.6 10.6 11 12 -7.4 1.4-10 4-11 12-1-8-3.6-10.6-11-12 7.4-1.4 10-4 11-12Z" fill="#C9503C"/>
  </g>

  <rect width="800" height="1000" filter="url(#grain)"/>
</svg>
