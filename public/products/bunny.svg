<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-labelledby="title">
  <title id="title">Mochi, a cream plush bunny with a little red bow</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FFF9EF"/>
      <stop offset="0.55" stop-color="#F8EAD9"/>
      <stop offset="1" stop-color="#EFDDC6"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#FFE8C6"/>
      <stop offset="1" stop-color="#FFE8C6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fur" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFCF4"/>
      <stop offset="0.55" stop-color="#F6E7D1"/>
      <stop offset="1" stop-color="#E8D2B4"/>
    </linearGradient>
    <linearGradient id="fur2" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FBF1E0"/>
      <stop offset="1" stop-color="#E4C9A6"/>
    </linearGradient>
    <linearGradient id="bow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E86952"/>
      <stop offset="1" stop-color="#B84533"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <ellipse cx="400" cy="420" rx="360" ry="340" fill="url(#halo)"/>
  <circle cx="400" cy="470" r="290" fill="none" stroke="#39271D" stroke-opacity="0.08" stroke-dasharray="2 11"/>
  <ellipse cx="404" cy="852" rx="220" ry="36" fill="#39271D" fill-opacity="0.17" filter="url(#soft)"/>

  <g>
    <g transform="rotate(-11 342 330)">
      <ellipse cx="342" cy="330" rx="56" ry="150" fill="url(#fur2)"/>
      <ellipse cx="342" cy="330" rx="30" ry="112" fill="#E8B9A0" opacity="0.55"/>
    </g>
    <g transform="rotate(13 462 320)">
      <ellipse cx="462" cy="320" rx="56" ry="150" fill="url(#fur)"/>
      <ellipse cx="462" cy="320" rx="30" ry="112" fill="#E8B9A0" opacity="0.5"/>
    </g>

    <ellipse cx="400" cy="690" rx="158" ry="172" fill="url(#fur2)"/>
    <ellipse cx="400" cy="716" rx="96" ry="118" fill="#FFFBF2" opacity="0.72"/>
    <ellipse cx="276" cy="668" rx="52" ry="92" transform="rotate(12 276 668)" fill="url(#fur)"/>
    <ellipse cx="524" cy="668" rx="52" ry="92" transform="rotate(-12 524 668)" fill="url(#fur)"/>
    <ellipse cx="318" cy="842" rx="70" ry="40" fill="url(#fur)"/>
    <ellipse cx="482" cy="842" rx="70" ry="40" fill="url(#fur)"/>

    <circle cx="400" cy="486" r="146" fill="url(#fur)"/>
    <ellipse cx="400" cy="520" rx="86" ry="66" fill="#FFFAF0" opacity="0.8"/>

    <circle cx="354" cy="474" r="12" fill="#39271D"/>
    <circle cx="446" cy="474" r="12" fill="#39271D"/>
    <circle cx="358" cy="469" r="4" fill="#FFF9EF"/>
    <circle cx="450" cy="469" r="4" fill="#FFF9EF"/>
    <ellipse cx="316" cy="522" rx="24" ry="14" fill="#E8A16A" opacity="0.42"/>
    <ellipse cx="484" cy="522" rx="24" ry="14" fill="#E8A16A" opacity="0.42"/>

    <path d="M400 508 c6 0 10 4 10 8 0 5-5 8-10 8s-10-3-10-8c0-4 4-8 10-8Z" fill="#39271D" opacity="0.8"/>
    <path d="M400 524 v7 M400 531 c-5 8-16 7-19 0 M400 531 c5 8 16 7 19 0" stroke="#39271D" stroke-width="3.4" fill="none" stroke-linecap="round" opacity="0.7"/>

    <g transform="translate(400 598)">
      <path d="M0 0 C-34 -28 -62 -6 -42 16 C-26 32 -10 18 0 6 Z" fill="url(#bow)"/>
      <path d="M0 0 C34 -28 62 -6 42 16 C26 32 10 18 0 6 Z" fill="url(#bow)"/>
      <path d="M-2 12 C-14 34 -18 48 -12 58 C-2 50 4 36 4 22 Z" fill="#B84533"/>
      <path d="M2 12 C14 34 18 48 12 58 C2 50 -4 36 -4 22 Z" fill="#C9503C"/>
      <circle cx="0" cy="6" r="13" fill="#E86952"/>
    </g>

    <g stroke="#D8B994" stroke-width="2.4" opacity="0.55" fill="none">
      <path d="M300 760 C316 774 336 780 356 778"/>
      <path d="M500 760 C484 774 464 780 444 778"/>
      <path d="M332 830 c10 6 22 8 34 6"/>
      <path d="M468 830 c-10 6-22 8-34 6"/>
    </g>
  </g>

  <g fill="#E9A23B" opacity="0.8">
    <path d="M158 300 c1.2 9 4.2 12 13 13 -8.8 1-11.8 4-13 13-1.2-9-4.2-12-13-13 8.8-1 11.8-4 13-13Z"/>
    <path d="M656 620 c1.2 9 4.2 12 13 13 -8.8 1-11.8 4-13 13-1.2-9-4.2-12-13-13 8.8-1 11.8-4 13-13Z" fill="#C9503C"/>
  </g>

  <rect width="800" height="1000" filter="url(#grain)"/>
</svg>
