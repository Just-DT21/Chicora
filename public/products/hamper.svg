<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-labelledby="title">
  <title id="title">A little birthday hamper with a candle, sweets and a ribbon</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFF9EF"/>
      <stop offset="0.6" stop-color="#F7EBD9"/>
      <stop offset="1" stop-color="#EEDDC5"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.38" r="0.55">
      <stop offset="0" stop-color="#FFE6BC"/>
      <stop offset="1" stop-color="#FFE6BC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="basket" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9C6A38"/>
      <stop offset="0.3" stop-color="#D2A269"/>
      <stop offset="0.65" stop-color="#E7BE8C"/>
      <stop offset="1" stop-color="#8E5C2C"/>
    </linearGradient>
    <linearGradient id="candle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B87525"/>
      <stop offset="0.4" stop-color="#F3C382"/>
      <stop offset="1" stop-color="#B87525"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E86952"/>
      <stop offset="1" stop-color="#A83E2E"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <ellipse cx="400" cy="400" rx="380" ry="350" fill="url(#halo)"/>
  <ellipse cx="404" cy="852" rx="270" ry="42" fill="#39271D" fill-opacity="0.18" filter="url(#soft)"/>

  <!-- contents -->
  <g>
    <rect x="300" y="330" width="90" height="230" rx="16" fill="url(#candle)"/>
    <ellipse cx="345" cy="330" rx="45" ry="12" fill="#F8DDB2"/>
    <path d="M345 318 C356 300 350 276 342 264 C334 280 334 302 345 318Z" fill="#F5A623"/>
    <path d="M345 312 C350 302 347 290 344 284 C340 292 340 304 345 312Z" fill="#FFF1C9"/>

    <rect x="404" y="386" width="130" height="140" rx="10" fill="url(#box)"/>
    <path d="M404 440 H534" stroke="#F5C4A8" stroke-width="10" opacity="0.7"/>
    <path d="M469 386 V526" stroke="#F5C4A8" stroke-width="10" opacity="0.7"/>
    <path d="M444 400 C420 376 404 396 420 414 C436 430 456 414 462 404Z" fill="#E9A23B"/>

    <g transform="translate(530 380)">
      <circle r="54" fill="#F5E6CF"/>
      <circle r="54" fill="none" stroke="#D8BE9A" stroke-width="3"/>
      <path d="M0 54 V96" stroke="#8C7A4E" stroke-width="4"/>
      <path d="M0 54 C-30 30 -46 10 -38 -8 C-22 -14 -4 8 0 26 C4 8 22 -14 38 -8 C46 10 30 30 0 54Z" fill="#C9503C" opacity="0.9"/>
    </g>

    <rect x="238" y="470" width="90" height="90" rx="8" fill="#8C9A76" transform="rotate(-12 283 515)"/>
    <path d="M250 500 H316 M250 520 H316 M250 540 H300" stroke="#F5EAD3" stroke-width="5" opacity="0.6"/>
  </g>

  <!-- basket -->
  <g>
    <path d="M196 540 H604 L574 800 C574 824 226 824 226 800 Z" fill="url(#basket)"/>
    <g stroke="#7A4A1E" stroke-opacity="0.35" stroke-width="3">
      <path d="M206 590 H594"/>
      <path d="M216 650 H584"/>
      <path d="M224 710 H576"/>
      <path d="M232 768 H568"/>
      <path d="M270 546 V812"/>
      <path d="M340 544 V818"/>
      <path d="M410 544 V820"/>
      <path d="M480 544 V818"/>
      <path d="M550 546 V812"/>
    </g>
    <path d="M196 540 H604" stroke="#7A4A1E" stroke-width="12" opacity="0.55"/>
    <path d="M196 540 C240 462 560 462 604 540" stroke="#C99A62" stroke-width="14" fill="none" opacity="0.85"/>

    <!-- bow -->
    <g transform="translate(400 552)">
      <path d="M0 0 C-40 -32 -78 -8 -54 18 C-32 40 -10 20 0 6Z" fill="#C9503C"/>
      <path d="M0 0 C40 -32 78 -8 54 18 C32 40 10 20 0 6Z" fill="#C9503C"/>
      <circle r="14" fill="#E86952"/>
      <path d="M-6 14 C-24 46 -30 66 -22 82 C-8 70 0 50 2 30Z" fill="#B84533"/>
      <path d="M6 14 C24 46 30 66 22 82 C8 70 0 50 -2 30Z" fill="#C9503C"/>
    </g>

    <!-- tag -->
    <g transform="rotate(8 566 640)">
      <rect x="534" y="612" width="76" height="48" rx="4" fill="#FFF7E6" stroke="#39271D" stroke-opacity="0.2"/>
      <circle cx="552" cy="626" r="4" fill="#F3E3CB" stroke="#39271D" stroke-opacity="0.25"/>
      <path d="M548 640 H594" stroke="#B87525" stroke-width="2"/>
      <path d="M548 650 H578" stroke="#39271D" stroke-opacity="0.15" stroke-width="2"/>
    </g>
  </g>

  <g fill="#E9A23B">
    <path d="M170 340 c1.2 9 4.2 12 13 13 -8.8 1-11.8 4-13 13-1.2-9-4.2-12-13-13 8.8-1 11.8-4 13-13Z"/>
    <path d="M668 480 c1.2 9 4.2 12 13 13 -8.8 1-11.8 4-13 13-1.2-9-4.2-12-13-13 8.8-1 11.8-4 13-13Z" fill="#C9503C"/>
    <circle cx="650" cy="660" r="4"/>
    <circle cx="150" cy="600" r="3"/>
  </g>

  <rect width="800" height="1000" filter="url(#grain)"/>
</svg>
